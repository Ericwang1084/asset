<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資產">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>資產</title>
<link rel="apple-touch-icon" id="icon">
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111;--sub:#8a8a8e;--line:#e5e5ea;--up:#e0302d;--dn:#16a34a;--ac:#0a84ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989f;--line:#38383a;--up:#ff5a52;--dn:#34d27b;--ac:#0a84ff}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989f;--line:#38383a;--up:#ff5a52;--dn:#34d27b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.hero{background:var(--card);border-radius:20px;padding:18px}
.hero small{color:var(--sub)}.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;color:var(--tx);padding:8px;border-radius:10px;font-size:15px}
.tabs button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0002}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.sub{color:var(--sub);font-size:13px}.num{font-variant-numeric:tabular-nums}
.lot{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
form{background:var(--card);border-radius:16px;padding:14px;display:grid;gap:8px;margin-top:14px}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);width:100%;min-width:0}
.g2{display:grid;grid-template-columns:1fr 90px;gap:8px}
.btn{border:0;background:var(--ac);color:#fff;padding:12px;border-radius:12px;font:inherit;font-weight:600}
.lnk{border:0;background:none;color:var(--ac);font:inherit;padding:0}
.x{color:var(--sub)}.msg{font-size:13px;color:var(--sub);margin-top:6px;min-height:18px}
</style>
</head>
<body>
<div class="w">
  <div class="hero">
    <div class="row"><small>總資產 (NT$)</small><button class="lnk" id="ref">更新股價</button></div>
    <div class="big num" id="net">0</div>
    <div class="num" id="pl"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="tabs" id="tabs"><button data-t="stocks" class="on">股票</button><button data-t="cash">現金</button><button data-t="pension">勞退金</button></div>
  <div id="list"></div>
  <form id="f"></form>
</div>
<script>
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('assets'))}catch(e){}
S=S||{stocks:[],cash:[],pension:[],t:null};
let tab='stocks',open={};
const save=()=>{try{localStorage.setItem('assets',JSON.stringify(S))}catch(e){}};
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const sg=n=>(n>0?'+':'')+fmt(n);
const pc=n=>(n>0?'+':'')+(n*100).toFixed(2)+'%';
const cl=n=>n>0?'up':n<0?'dn':'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shr=n=>n>=1000?Math.floor(n/1000)+'張'+(n%1000?' '+n%1000+'股':''):n+'股';

function calc(s){const sh=s.lots.reduce((a,l)=>a+l.n,0),cost=s.lots.reduce((a,l)=>a+l.n*l.p,0);
  const avg=sh?cost/sh:0,px=s.price??avg,val=px*sh;return{sh,cost,avg,val,pl:val-cost,px}}

async function quotes(codes){
  const ch=[...new Set(codes)].flatMap(c=>['tse_'+c+'.tw','otc_'+c+'.tw']).join('|');
  const u='https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch='+ch+'&json=1&delay=0';
  for(const url of [u,'https://api.allorigins.win/raw?url='+encodeURIComponent(u)]){
    try{const j=await (await fetch(url)).json(),out={};
      for(const i of j.msgArray||[]){const z=parseFloat(i.z),b=parseFloat((i.b||'').split('_')[0]),y=parseFloat(i.y);
        out[i.c]={n:i.n,p:[z,b,y].find(x=>x>0)}}
      if(Object.keys(out).length)return out}catch(e){}}
  return null}

async function refresh(){
  if(!S.stocks.length)return;
  $('#msg').textContent='更新股價中…';
  const q=await quotes(S.stocks.map(s=>s.code));
  if(!q){$('#msg').textContent='無法自動取得股價，可點股價手動輸入';return}
  S.stocks.forEach(s=>{const r=q[s.code];if(r){s.name=r.n;if(r.p)s.price=r.p}});
  S.t=Date.now();save();render()}

function render(){
  let sv=0,sc=0;S.stocks.forEach(s=>{const c=calc(s);sv+=c.val;sc+=c.cost});
  const ca=S.cash.reduce((a,x)=>a+x.amt,0),pe=S.pension.reduce((a,x)=>a+x.amt,0);
  $('#net').textContent=fmt(sv+ca+pe);
  const pl=sv-sc;$('#pl').innerHTML='股票損益 <b class="'+cl(pl)+'">'+sg(pl)+' ('+pc(sc?pl/sc:0)+')</b>';
  if(S.t&&!$('#msg').textContent.includes('無法'))$('#msg').textContent='股價更新 '+new Date(S.t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const L=$('#list'),F=$('#f');
  if(tab==='stocks'){
    L.innerHTML=S.stocks.map((s,i)=>{const c=calc(s);return '<div class="card"><div class="row"><b>'+esc(s.code)+' '+esc(s.name)+'</b>'+
      '<button class="lnk num" data-a="px" data-i="'+i+'">'+(s.price?s.price.toFixed(2):'輸入股價')+'</button></div>'+
      '<div class="row sub"><span>'+shr(c.sh)+'・均價 '+c.avg.toFixed(2)+'</span><span class="num">市值 '+fmt(c.val)+'</span></div>'+
      '<div class="row"><button class="lnk sub" data-a="tg" data-i="'+i+'">'+(open[s.code]?'收合':'買入明細 ('+s.lots.length+')')+'</button>'+
      '<b class="num '+cl(c.pl)+'">'+sg(c.pl)+'　'+pc(c.cost?c.pl/c.cost:0)+'</b></div>'+
      (open[s.code]?s.lots.map((l,j)=>{const p=(c.px-l.p)*l.n;return '<div class="lot row"><span>'+shr(l.n)+' @ '+l.p+'</span><span class="num '+cl(p)+'">'+sg(p)+
        ' <button class="lnk x" data-a="dl" data-i="'+i+'" data-j="'+j+'">刪除</button></span></div>'}).join('')+
        '<div class="row" style="margin-top:8px"><span></span><button class="lnk x" data-a="ds" data-i="'+i+'">刪除整檔</button></div>':'')+'</div>'}).join('')||'<div class="sub" style="text-align:center;padding:20px">尚未新增股票</div>';
    F.innerHTML='<b>新增買入（可分批加碼）</b><div class="g2"><input id="code" placeholder="股號，例如 2330" inputmode="text" autocapitalize="characters"><select id="u"><option value="1000">張</option><option value="1">零股</option></select></div>'+
      '<div class="g2"><input id="q" type="number" inputmode="decimal" placeholder="數量"><input id="p" type="number" inputmode="decimal" placeholder="買入價"></div><button class="btn">加入</button>';
  }else{
    const k=tab,name=k==='cash'?'現金':'勞退金';
    L.innerHTML=S[k].map((a,i)=>'<div class="card row"><span>'+esc(a.name)+'</span><span><button class="lnk num" data-a="am" data-i="'+i+'">'+fmt(a.amt)+'</button> <button class="lnk x" data-a="da" data-i="'+i+'">✕</button></span></div>').join('')||'<div class="sub" style="text-align:center;padding:20px">尚未新增'+name+'</div>';
    F.innerHTML='<b>新增'+name+'</b><input id="an" placeholder="名稱，例如 '+(k==='cash'?'活存':'勞退專戶')+'"><input id="am" type="number" inputmode="decimal" placeholder="金額"><button class="btn">加入</button>'}
}

$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$('#ref').onclick=refresh;
$('#list').onclick=e=>{const d=e.target.dataset;if(!d.a)return;const i=+d.i;
  if(d.a==='tg'){const c=S.stocks[i].code;open[c]=!open[c]}
  if(d.a==='px'){const v=parseFloat(prompt('目前股價',S.stocks[i].price||''));if(v>0){S.stocks[i].price=v}}
  if(d.a==='dl'){S.stocks[i].lots.splice(+d.j,1);if(!S.stocks[i].lots.length)S.stocks.splice(i,1)}
  if(d.a==='ds'&&confirm('刪除整檔？'))S.stocks.splice(i,1);
  if(d.a==='am'){const v=parseFloat(prompt('金額',S[tab][i].amt));if(!isNaN(v))S[tab][i].amt=v}
  if(d.a==='da'&&confirm('刪除？'))S[tab].splice(i,1);
  save();render()};
$('#f').onsubmit=async e=>{e.preventDefault();
  if(tab==='stocks'){
    const code=$('#code').value.trim().toUpperCase(),n=parseFloat($('#q').value)*+$('#u').value,p=parseFloat($('#p').value);
    if(!code||!(n>0)||!(p>0))return;
    let s=S.stocks.find(x=>x.code===code);
    if(!s){s={code,name:code,price:null,lots:[]};$('#msg').textContent='查詢 '+code+'…';
      const q=await quotes([code]);
      if(q&&q[code]){s.name=q[code].n;s.price=q[code].p||null}
      else{const nm=prompt('查不到名稱，請手動輸入（可略過）','');if(nm)s.name=nm}
      S.stocks.push(s)}
    s.lots.push({n:Math.round(n),p});$('#msg').textContent='';
  }else{
    const nm=$('#an').value.trim()||(tab==='cash'?'現金':'勞退金'),a=parseFloat($('#am').value);
    if(isNaN(a))return;S[tab].push({name:nm,amt:a})}
  save();render()};

// 主畫面圖示
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#0a84ff';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='bold 110px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('資',90,98);
  $('#icon').href=c.toDataURL('image/png')}catch(e){}
render();refresh();
</script>
</body>
</html>
