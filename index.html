<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資產">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>資產</title>
<link rel="apple-touch-icon" id="icon">
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111;--sub:#8a8a8e;--line:#e5e5ea;--up:#e0302d;--dn:#16a34a;--ac:#0a84ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989f;--line:#38383a;--up:#ff5a52;--dn:#34d27b;--ac:#0a84ff}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989f;--line:#38383a;--up:#ff5a52;--dn:#34d27b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.hero{background:var(--card);border-radius:20px;padding:18px}
.hero small{color:var(--sub)}.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{overflow-x:auto;display:flex;background:var(--line);border-radius:12px;padding:3px;margin:14px 0}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--tx);padding:8px 12px;border-radius:10px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0002}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.sub{color:var(--sub);font-size:13px}.num{font-variant-numeric:tabular-nums}
.lot{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
form{background:var(--card);border-radius:16px;padding:14px;display:grid;gap:8px;margin-top:14px}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);width:100%;min-width:0}
.g2{display:grid;grid-template-columns:1fr 90px;gap:8px}
.btn{border:0;background:var(--ac);color:#fff;padding:12px;border-radius:12px;font:inherit;font-weight:600}
.lnk{border:0;background:none;color:var(--ac);font:inherit;padding:0}
.act{display:flex;gap:18px;justify-content:flex-end;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.x{color:var(--sub)}.msg{font-size:13px;color:var(--sub);margin-top:6px;min-height:18px}
</style>
</head>
<body>
<div class="w">
  <div class="hero">
    <div class="row"><small>總資產 (NT$)</small><button class="lnk" id="ref">更新股價</button></div>
    <div class="big num" id="net">0</div>
    <div class="num" id="pl" style="font-size:14px"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="tabs" id="tabs"><button data-t="total" class="on">總資產</button><button data-t="stocks">台股</button><button data-t="us">美股</button><button data-t="gold">黃金</button><button data-t="funds">基金保單</button><button data-t="cash">現金</button><button data-t="pension">勞退金</button></div>
  <div id="bar"></div>
  <div id="list"></div>
  <form id="f"></form>
  <div class="sub" style="text-align:center;margin-top:20px;font-size:12px">版本 v12・10/02　<button class="lnk" id="dg" style="font-size:12px">診斷連線</button>　<button class="lnk" id="px" style="font-size:12px">設定代理</button></div>
  <div class="card sub" id="dgout" style="display:none;margin-top:12px;font-size:12px;line-height:1.7"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let S={};try{S=JSON.parse(localStorage.getItem('assets'))||{}}catch(e){}
S=Object.assign({stocks:[],us:[],funds:[],gold:{price:null,lots:[]},cash:[],pension:[],fx:null,t:null,proxy:''},S);
if(!S.gold||!S.gold.lots)S.gold={price:null,lots:[]};
let tab='total',open={},note='';
const save=()=>{try{localStorage.setItem('assets',JSON.stringify(S))}catch(e){}};
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const f2=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=n=>(n>0?'+':'')+fmt(n);
const pc=n=>(n>0?'+':'')+(n*100).toFixed(2)+'%';
const cl=n=>n>0?'up':n<0?'dn':'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shr=n=>n>=1000?Math.floor(n/1000)+'張'+(n%1000?' '+n%1000+'股':''):n+'股';
const FX=()=>S.fx||0;
const TWF=0.995575;

function calc(s){const sh=s.lots.reduce((a,l)=>a+l.n,0),cost=s.lots.reduce((a,l)=>a+l.n*l.p,0);
  const avg=sh?cost/sh:0,px=s.price??avg,val=px*sh;return{sh,cost,avg,val,pl:Math.round(val*TWF-cost),px}}
function calcU(s){const sh=s.lots.reduce((a,l)=>a+l.n,0),cu=s.lots.reduce((a,l)=>a+l.n*l.p,0),
  ct=s.lots.reduce((a,l)=>a+l.n*l.p*(l.fx||FX()),0),avg=sh?cu/sh:0,px=s.price??avg,vu=px*sh,vt=vu*FX();
  return{sh,cu,ct,avg,px,vu,vt,pu:vu-cu,pt:vt-ct}}
function calcG(){const g=S.gold,n=g.lots.reduce((a,l)=>a+l.n,0),c=g.lots.reduce((a,l)=>a+l.n*l.p,0),
  avg=n?c/n:0,px=g.price??avg;return{n,c,avg,px,v:px*n,pl:px*n-c}}

const TO=(u,ms=6000)=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal})};
const DIRECT=[u=>u],FREE=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
const WK=()=>S.proxy?[u=>S.proxy.replace(/\/*$/,'/')+'?u='+encodeURIComponent(u)]:[];
const ALL=()=>[...DIRECT,...WK(),...FREE],NOD=()=>[...WK(),...FREE],DAY=()=>[...DIRECT,...WK(),FREE[0]];
// 同時嘗試直連與各代理，取最先成功的結果
function viaProxy(u,parse,list=ALL(),text=false){return new Promise(res=>{let n=list.length;
  list.forEach(async f=>{try{const b=await (await TO(f(u))).text();const r=parse(text?b:JSON.parse(b));if(r){res(r);return}}catch(e){}if(--n===0)res(null)})})}
const parseMis=j=>{const out={};for(const i of j.msgArray||[]){const z=parseFloat(i.z),b=parseFloat((i.b||'').split('_')[0]),y=parseFloat(i.y);
  out[i.c]={n:i.n,p:[z,b,y].find(x=>x>0)}}return Object.keys(out).length?out:null};
// 證交所盤後全部上市股票收盤價（www.twse.com.tw 允許瀏覽器直連；實際回傳可能是 CSV 或 JSON，兩者都支援）
const csvRow=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o};
const parseTwse=t=>{t=t.replace(/^\uFEFF/,'').trim();const o={};let rows,fields;
  if(t[0]==='{'){const j=JSON.parse(t);fields=j.fields||[];rows=j.data||[]}
  else{const L=t.split(/\r?\n/).filter(Boolean).map(csvRow);fields=L[0].map(x=>x.trim());rows=L.slice(1)}
  const ci=fields.indexOf('收盤價'),ki=fields.indexOf('證券代號'),ni=fields.indexOf('證券名稱');
  if(ci<0||ki<0)return null;
  for(const r of rows){const p=parseFloat(String(r[ci]).replace(/,/g,''));if(p>0)o[String(r[ki]).trim()]={n:String(r[ni]||'').trim(),p}}
  return Object.keys(o).length>100?o:null};
const TWSE_DAY='https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY_ALL?response=json';
const twseDay=()=>viaProxy(TWSE_DAY,parseTwse,DAY(),true);
// Yahoo Finance（美股、匯率、台股備援）；美股再備援 Stooq
const yq=async sym=>{
  const y=await viaProxy('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?interval=1d&range=1d',j=>{
    const m=j.chart.result[0].meta;return m.regularMarketPrice>0?{n:m.shortName||m.longName||sym,p:m.regularMarketPrice}:null});
  if(y||/=|\.TW/.test(sym))return y;
  return viaProxy('https://stooq.com/q/l/?s='+encodeURIComponent(sym.toLowerCase())+'.us&f=sd2t2c&h&e=csv',t=>{
    const l=t.trim().split('\n')[1];if(!l)return null;const p=parseFloat(l.split(',')[3]);return p>0?{n:sym,p}:null},ALL(),true)};
// 美元兌台幣：Yahoo → open.er-api.com
const fxq=async()=>{const r=await yq('TWD=X');if(r)return r.p;
  return viaProxy('https://open.er-api.com/v6/latest/USD',j=>j.rates&&j.rates.TWD>0?j.rates.TWD:null)};
// 臺灣銀行黃金存摺牌價（每公克）：回售價=本行買進，以此估算持有市值
const goldq=()=>viaProxy('https://rate.bot.com.tw/gold?Lang=zh-TW',t=>{
  const s=t.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
  const m=s.match(/黃金存摺\s*本行賣出\s*([\d,]+)[\s\S]{0,60}?本行買進\s*([\d,]+)/);if(!m)return null;
  const b=parseFloat(m[2].replace(/,/g,''));return b>0?{sell:parseFloat(m[1].replace(/,/g,'')),buy:b}:null},ALL(),true);
// 備援：國際金價(Yahoo GC=F, 美元/盎司) × 美元兌台幣 ÷ 31.1035 = 每公克新台幣（未含銀行買賣價差）
const goldIntl=async()=>{const [g,f]=await Promise.all([yq('GC=F'),fxq()]);return g&&f?g.p*f/31.1035:null};
// 台股：即時行情(代理) → 證交所盤後收盤價 → Yahoo(上市 .TW / 上櫃 .TWO)
async function quotes(codes){
  codes=[...new Set(codes)];
  const ch=codes.flatMap(c=>['tse_'+c+'.tw','otc_'+c+'.tw']).join('|');
  const [m,d]=await Promise.all([viaProxy('https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch='+ch+'&json=1&delay=0',parseMis,NOD()),twseDay()]);
  const out={};
  codes.forEach(c=>{if(m&&m[c]&&m[c].p)out[c]={...m[c],s:'m'};else if(d&&d[c])out[c]={...d[c],s:'d'}});
  await Promise.all(codes.filter(c=>!out[c]).map(async c=>{const r=(await yq(c+'.TW'))||(await yq(c+'.TWO'));if(r)out[c]={...r,s:'y'}}));
  return Object.keys(out).length?out:null}

async function refresh(){
  $('#msg').textContent='更新價格中…';const bad=[],jobs=[];let dn=false;
  if(S.stocks.length)jobs.push(quotes(S.stocks.map(s=>s.code)).then(q=>{
    S.stocks.forEach(s=>{const r=q&&q[s.code];if(!r){bad.push(s.code);return}
      if(r.s==='d')dn=true;if(/[\u4e00-\u9fff]/.test(r.n)||s.name===s.code)s.name=r.n;if(r.p)s.price=r.p})}));
  S.us.forEach(s=>jobs.push(yq(s.code).then(r=>{if(!r){bad.push(s.code);return}s.price=r.p;if(!s.name||s.name===s.code)s.name=r.n})));
  if(S.gold.lots.length||tab==='gold')jobs.push((async()=>{const r=await goldq();if(r){S.gold.price=r.buy;S.gold.src='臺銀回售價';return}
    if(!S.gold.price||S.gold.src){const v=await goldIntl();if(v){S.gold.price=Math.round(v*100)/100;S.gold.src='國際金價換算(未含銀行價差)';return}}
    if(!S.gold.price)bad.push('黃金')})());
  if(S.us.length)jobs.push(fxq().then(r=>{if(r)S.fx=r;else bad.push('匯率')}));
  await Promise.all(jobs);
  note=bad.length?'無法取得：'+bad.join('、')+'（可點價格手動輸入，或點最下方「診斷連線」）':dn?'部分台股為證交所盤後收盤價（盤中可能是前一日收盤）':'';
  S.t=Date.now();save();render()}

const NAMES={total:'總資產',stocks:'台股',us:'美股',gold:'黃金',funds:'基金保單',cash:'現金',pension:'勞退金'};
function render(){
  let sv=0,sc=0,spl=0,uv=0,uc=0;
  S.stocks.forEach(s=>{const c=calc(s);sv+=c.val;sc+=c.cost;spl+=c.pl});
  S.us.forEach(s=>{const c=calcU(s);uv+=c.vt;uc+=c.ct});
  const G=calcG(),fl=S.funds.reduce((a,f)=>a+f.val,0),fcst=S.funds.reduce((a,f)=>a+f.cost,0),ca=S.cash.reduce((a,x)=>a+x.amt,0),pe=S.pension.reduce((a,x)=>a+x.amt,0);
  $('#net').textContent=fmt(sv+uv+G.v+fl+ca+pe);
  const b=(l,v)=>l+' <b class="'+cl(v)+'">'+sg(v)+'</b>';
  $('#pl').innerHTML='<span class="sub">損益　</span>'+b('台股',spl)+'　'+b('美股',uv-uc)+'　'+b('黃金',G.pl)+'　'+b('基金保單',fl-fcst);
  $('#msg').textContent=note||(S.t?'價格更新 '+new Date(S.t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):'');
  const rb=$('#ref');rb.style.display=(tab==='stocks'||tab==='us'||tab==='gold')?'':'none';rb.textContent=tab==='gold'?'更新價格':'更新股價';
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));
  const cnt={stocks:S.stocks.length,us:S.us.length,gold:S.gold.lots.length,funds:S.funds.length};
  $('#bar').innerHTML=tab in cnt?'<div class="row" style="margin:0 2px 10px"><span class="sub">共 '+cnt[tab]+(tab==='gold'||tab==='funds'?' 筆':' 檔')+(tab==='stocks'?'・損益已乘 0.995575':'')+'</span><button class="lnk" data-a="new">＋ 新增</button></div>':'';
  const L=$('#list'),F=$('#f'),empty='<div class="sub" style="text-align:center;padding:20px">尚未新增'+NAMES[tab]+'</div>';
  F.style.display=tab==='total'?'none':'';
  if(tab==='total'){
    const parts=[['台股',sv,'#0a84ff','stocks'],['美股',uv,'#ff9f0a','us'],['黃金',G.v,'#f5c400','gold'],['基金保單',fl,'#bf5af2','funds'],['現金',ca,'#30b36b','cash'],['勞退金',pe,'#64d2ff','pension']].filter(x=>x[1]>0);
    const tot=parts.reduce((a,x)=>a+x[1],0),C=2*Math.PI*25;let cum=0;
    const segs=parts.map(x=>{const d=x[1]/tot*C,s='<circle r="25" cx="50" cy="50" fill="none" stroke="'+x[2]+'" stroke-width="50" stroke-dasharray="'+d+' '+(C-d)+'" stroke-dashoffset="'+(-cum)+'"/>';cum+=d;return s}).join('');
    L.innerHTML=tot?'<div class="card"><svg viewBox="0 0 100 100" style="width:100%;max-width:280px;display:block;margin:4px auto 14px;transform:rotate(-90deg)">'+segs+'</svg>'+
      parts.map(x=>'<div class="lot row" data-a="go" data-t="'+x[3]+'" style="cursor:pointer"><span><i class="dot" style="background:'+x[2]+'"></i>'+x[0]+'</span><span class="num">'+fmt(x[1])+'　<b>'+(x[1]/tot*100).toFixed(1)+'%</b></span></div>').join('')+
      '<div class="lot row"><b>合計</b><b class="num">'+fmt(tot)+'</b></div></div>':'<div class="sub" style="text-align:center;padding:20px">尚無資產資料，請先到各分頁新增</div>';
  }else if(tab==='stocks'){
    L.innerHTML=S.stocks.map((s,i)=>{const c=calc(s);return '<div class="card"><div class="row"><b>'+esc(s.code)+' '+esc(s.name)+'</b>'+
      '<button class="lnk num" data-a="px" data-i="'+i+'">'+(s.price?s.price.toFixed(2):'輸入股價')+'</button></div>'+
      '<div class="row sub"><span>'+shr(c.sh)+'・均價 '+c.avg.toFixed(2)+'</span><span class="num">市值 '+fmt(c.val)+'</span></div>'+
      '<div class="row"><button class="lnk sub" data-a="tg" data-i="'+i+'">'+(open[s.code]?'收合':'買入明細 ('+s.lots.length+')')+'</button>'+
      '<b class="num '+cl(c.pl)+'">'+sg(c.pl)+'　'+pc(c.cost?c.pl/c.cost:0)+'</b></div>'+
      (open[s.code]?s.lots.map((l,j)=>{const p=Math.round(c.px*l.n*TWF-l.p*l.n);return '<div class="lot row"><span>'+shr(l.n)+' @ '+l.p+'</span><span class="num '+cl(p)+'">'+sg(p)+
        ' <button class="lnk x" data-a="dl" data-i="'+i+'" data-j="'+j+'">刪除</button></span></div>'}).join('')+
        '':'')+'<div class="act"><button class="lnk" data-a="add" data-i="'+i+'">＋ 加碼</button><button class="lnk x" data-a="ds" data-i="'+i+'">刪除</button></div></div>'}).join('')||empty;
    F.innerHTML='<b>新增台股買入（可分批加碼）</b><div class="g2"><input id="code" placeholder="股號，例如 2330" autocapitalize="characters"><select id="u"><option value="1000">張</option><option value="1">零股</option></select></div>'+
      '<div class="g2"><input id="q" type="number" inputmode="decimal" placeholder="數量"><input id="p" type="number" inputmode="decimal" placeholder="買入價"></div><button class="btn">加入</button>';
  }else if(tab==='us'){
    L.innerHTML='<div class="card row"><span class="sub">美元匯率 USD/TWD</span><button class="lnk num" data-a="fx">'+(S.fx?S.fx.toFixed(3):'輸入匯率')+'</button></div>'+
      (S.us.map((s,i)=>{const c=calcU(s);return '<div class="card"><div class="row"><b>'+esc(s.code)+' <span class="sub">'+esc(s.name)+'</span></b>'+
      '<button class="lnk num" data-a="px" data-i="'+i+'">'+(s.price?'$'+f2(s.price):'輸入股價')+'</button></div>'+
      '<div class="row sub"><span>'+(+c.sh.toFixed(4))+' 股・均價 $'+f2(c.avg)+'</span><span class="num">市值 $'+f2(c.vu)+' ≈ '+fmt(c.vt)+'</span></div>'+
      '<div class="row"><button class="lnk sub" data-a="tg" data-i="'+i+'">'+(open[s.code]?'收合':'買入明細 ('+s.lots.length+')')+'</button>'+
      '<b class="num '+cl(c.pt)+'">'+sg(c.pt)+'　'+pc(c.ct?c.pt/c.ct:0)+'</b></div>'+
      '<div class="sub" style="text-align:right">美元損益 '+(c.pu>0?'+':'')+f2(c.pu)+'（含匯差）</div>'+
      (open[s.code]?s.lots.map((l,j)=>{const p=(c.px-l.p)*l.n;return '<div class="lot row"><span>'+(+l.n.toFixed(4))+' 股 @ $'+l.p+(l.fx?'・匯率 '+l.fx.toFixed(2):'')+'</span><span class="num '+cl(p)+'">'+(p>0?'+':'')+f2(p)+
        ' <button class="lnk x" data-a="dl" data-i="'+i+'" data-j="'+j+'">刪除</button></span></div>'}).join('')+
        '':'')+'<div class="act"><button class="lnk" data-a="add" data-i="'+i+'">＋ 加碼</button><button class="lnk x" data-a="ds" data-i="'+i+'">刪除</button></div></div>'}).join('')||empty);
    F.innerHTML='<b>新增美股買入（可分批加碼）</b><input id="code" placeholder="代號，例如 AAPL、VOO" autocapitalize="characters">'+
      '<div class="g2" style="grid-template-columns:1fr 1fr"><input id="q" type="number" inputmode="decimal" placeholder="股數（可小數）"><input id="p" type="number" inputmode="decimal" placeholder="買入價 USD"></div>'+
      '<input id="fx" type="number" inputmode="decimal" placeholder="買入時匯率（選填，空白用目前匯率）"><button class="btn">加入</button>';
  }else if(tab==='gold'){
    L.innerHTML='<div class="card"><div class="row"><b>黃金 '+f2(G.n)+' 公克</b><span class="sub">≈ '+f2(G.n/3.75)+' 台錢</span></div>'+
      '<div class="row sub"><span>均價 '+f2(G.avg)+' /公克</span><span class="num">市值 '+fmt(G.v)+'</span></div>'+
      '<div class="row"><span class="sub">現價 <button class="lnk num" data-a="gp">'+(S.gold.price?f2(S.gold.price)+' /公克':'輸入金價')+'</button>'+(S.gold.price?' ≈ '+fmt(S.gold.price*3.75)+' /錢':'')+(S.gold.src?'・'+S.gold.src:'')+'</span>'+
      '<b class="num '+cl(G.pl)+'">'+sg(G.pl)+'　'+pc(G.c?G.pl/G.c:0)+'</b></div>'+
      '<div class="act"><button class="lnk" data-a="new">＋ 新增買入</button><button class="lnk x" data-a="gclr">全部刪除</button></div></div>'+
      S.gold.lots.map((l,j)=>{const p=(G.px-l.p)*l.n;return '<div class="card row"><span>'+(l.name?esc(l.name)+'・':'')+f2(l.n)+' 公克 @ '+f2(l.p)+'</span><span class="num '+cl(p)+'">'+sg(p)+
        ' <button class="lnk x" data-a="gd" data-j="'+j+'">刪除</button></span></div>'}).join('');
    F.innerHTML='<b>新增黃金買入</b><input id="gn" placeholder="名稱（選填，例如 黃金存摺、金條）">'+
      '<div class="g2"><input id="q" type="number" inputmode="decimal" placeholder="數量"><select id="gu"><option value="1">公克</option><option value="3.75">台錢</option><option value="37.5">台兩</option></select></div>'+
      '<input id="p" type="number" inputmode="decimal" placeholder="買入單價 NT$（依上方所選單位）"><button class="btn">加入</button>';
  }else if(tab==='funds'){
    L.innerHTML=S.funds.map((f,i)=>{const pl=f.val-f.cost;return '<div class="card"><div class="row"><b>'+esc(f.name)+' <span class="sub">'+esc(f.type)+'</span></b>'+
      '<button class="lnk num" data-a="fv" data-i="'+i+'">現值 '+fmt(f.val)+'</button></div>'+
      '<div class="row sub"><span>投入 '+fmt(f.cost)+'</span><b class="num '+cl(pl)+'">'+sg(pl)+'　'+pc(f.cost?pl/f.cost:0)+'</b></div>'+
      '<div class="act"><button class="lnk" data-a="fe" data-i="'+i+'">修改投入</button><button class="lnk x" data-a="fd" data-i="'+i+'">刪除</button></div></div>'}).join('')||empty;
    F.innerHTML='<b>新增基金保單</b><input id="fn" placeholder="名稱，例如 全球股票基金、儲蓄險"><select id="ft"><option>基金</option><option>保單</option><option>其他</option></select>'+
      '<div class="g2" style="grid-template-columns:1fr 1fr"><input id="fc" type="number" inputmode="decimal" placeholder="投入金額 NT$"><input id="fv" type="number" inputmode="decimal" placeholder="目前價值 NT$"></div><button class="btn">加入</button>';
  }else{
    L.innerHTML=S[tab].map((a,i)=>'<div class="card row"><span>'+esc(a.name)+'</span><span><button class="lnk num" data-a="am" data-i="'+i+'">'+fmt(a.amt)+'</button> <button class="lnk x" data-a="da" data-i="'+i+'">✕</button></span></div>').join('')||empty;
    F.innerHTML='<b>新增'+NAMES[tab]+'</b><input id="an" placeholder="名稱，例如 '+(tab==='cash'?'活存':'勞退專戶')+'"><input id="am" type="number" inputmode="decimal" placeholder="金額"><button class="btn">加入</button>'}
}

$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$('#ref').onclick=refresh;
const act=e=>{const el=e.target.closest('[data-a]');if(!el)return;const d=el.dataset;const i=+d.i;
  if(d.a==='go'){tab=d.t;render();window.scrollTo(0,0);return}
  const goForm=()=>{$('#f').scrollIntoView({behavior:'smooth',block:'center'});const el=$('#f input');if(el)el.focus()};
  if(d.a==='new'){goForm();return}
  if(d.a==='add'){goForm();$('#code').value=S[tab][i].code;$('#q').focus();return}
  if(d.a==='gclr'){if(confirm('刪除所有黃金買入紀錄？')){S.gold.lots=[];save();render()}return}
  if(d.a==='fv'){const v=parseFloat(prompt('目前價值（新台幣）',S.funds[i].val));if(v>=0)S.funds[i].val=v}
  if(d.a==='fe'){const v=parseFloat(prompt('累計投入金額（新台幣）',S.funds[i].cost));if(v>=0)S.funds[i].cost=v}
  if(d.a==='fd'&&confirm('刪除這筆？'))S.funds.splice(i,1);
  if(d.a==='tg'){const c=S[tab][i].code;open[c]=!open[c]}
  if(d.a==='px'){const v=parseFloat(prompt('目前股價',S[tab][i].price||''));if(v>0)S[tab][i].price=v}
  if(d.a==='dl'){S[tab][i].lots.splice(+d.j,1);if(!S[tab][i].lots.length)S[tab].splice(i,1)}
  if(d.a==='ds'&&confirm('刪除整檔？'))S[tab].splice(i,1);
  if(d.a==='fx'){const v=parseFloat(prompt('1 美元兌新台幣',S.fx||''));if(v>0)S.fx=v}
  if(d.a==='gp'){const v=parseFloat(prompt('目前金價（新台幣／每公克）',S.gold.price||''));if(v>0){S.gold.price=v;S.gold.src=''}}
  if(d.a==='gd'&&confirm('刪除這筆？'))S.gold.lots.splice(+d.j,1);
  if(d.a==='am'){const v=parseFloat(prompt('金額',S[tab][i].amt));if(!isNaN(v))S[tab][i].amt=v}
  if(d.a==='da'&&confirm('刪除？'))S[tab].splice(i,1);
  save();render()};
$('#list').onclick=$('#bar').onclick=act;
$('#f').onsubmit=async e=>{e.preventDefault();
  if(tab==='stocks'){
    const code=$('#code').value.trim().toUpperCase(),n=parseFloat($('#q').value)*+$('#u').value,p=parseFloat($('#p').value);
    if(!code||!(n>0)||!(p>0))return;
    let s=S.stocks.find(x=>x.code===code);
    if(!s){s={code,name:code,price:null,lots:[]};$('#msg').textContent='查詢 '+code+'…';
      const q=await quotes([code]);
      if(q&&q[code]){s.name=q[code].n;s.price=q[code].p||null}
      else{const nm=prompt('查不到名稱，請手動輸入（可略過）','');if(nm)s.name=nm}
      S.stocks.push(s)}
    s.lots.push({n:Math.round(n),p});note=s.price?'':'無法自動取得 '+code+' 股價，請點價格手動輸入';
  }else if(tab==='us'){
    const code=$('#code').value.trim().toUpperCase(),n=parseFloat($('#q').value),p=parseFloat($('#p').value),f=parseFloat($('#fx').value)||null;
    if(!code||!(n>0)||!(p>0))return;
    $('#msg').textContent='查詢 '+code+'…';
    let s=S.us.find(x=>x.code===code);
    if(!s){s={code,name:code,price:null,lots:[]};const r=await yq(code);if(r){s.name=r.n;s.price=r.p}S.us.push(s)}
    if(!S.fx){const r=await fxq();if(r)S.fx=r;else{const v=parseFloat(prompt('無法取得匯率，請輸入 1 美元兌新台幣',''));if(v>0)S.fx=v}}
    s.lots.push({n,p,fx:f||S.fx});note=s.price?'':'無法自動取得 '+code+' 股價，請點價格手動輸入';
  }else if(tab==='gold'){
    const u=+$('#gu').value,q=parseFloat($('#q').value),p=parseFloat($('#p').value);
    if(!(q>0)||!(p>0))return;
    S.gold.lots.push({name:$('#gn').value.trim(),n:q*u,p:p/u});
  }else if(tab==='funds'){
    const nm=$('#fn').value.trim(),c=parseFloat($('#fc').value),v=parseFloat($('#fv').value);
    if(!nm||isNaN(c))return;S.funds.push({name:nm,type:$('#ft').value,cost:c,val:isNaN(v)?c:v})
  }else{
    const nm=$('#an').value.trim()||NAMES[tab],a=parseFloat($('#am').value);
    if(isNaN(a))return;S[tab].push({name:nm,amt:a})}
  save();render()};

try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#0a84ff';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='bold 110px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('資',90,98);
  $('#icon').href=c.toDataURL('image/png')}catch(e){}
async function probe(label,u,check,text){
  const R=[['直連',x=>x],...(S.proxy?[['自架代理',WK()[0]]]:[]),['allorigins',FREE[0]],['codetabs',FREE[1]]];
  const rows=await Promise.all(R.map(async([n,f])=>{const t0=Date.now();try{const r=await TO(f(u),8000);if(!r.ok){const tx=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+(tx?'：'+tx.slice(0,25):''))}
    const b=await r.text();let v=b;if(!text){try{v=JSON.parse(b)}catch(e){throw new Error('回傳不是 JSON：'+b.slice(0,15))}}try{check(v)}catch(e){throw new Error(e.message+'｜收到：'+String(b).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,40))}return n+' ✓ '+(Date.now()-t0)+'ms'}catch(e){return n+' ✗ '+(e.name==='AbortError'?'逾時':e.message==='Failed to fetch'?'被瀏覽器擋(CORS/網路)':e.message)}}));
  return '<b>'+label+'</b><br>'+rows.join('<br>')}
$('#dg').onclick=async()=>{const o=$('#dgout');o.style.display='block';o.textContent='診斷中，約需 10 秒…';
  const need=(c,m)=>{if(!c)throw new Error(m||'內容格式不符')};
  const out=[await Promise.all([
    probe('台股 證交所盤後收盤價',TWSE_DAY,t=>need(parseTwse(t),'無法解析'),true),
    probe('台股 即時行情','https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw&json=1&delay=0',j=>need(j.msgArray&&j.msgArray.length)),
    probe('美股 Yahoo (AAPL)','https://query1.finance.yahoo.com/v8/finance/chart/AAPL?interval=1d&range=1d',j=>need(j.chart.result[0].meta.regularMarketPrice>0)),
    probe('黃金 臺灣銀行','https://rate.bot.com.tw/gold?Lang=zh-TW',t=>need(/本行買進/.test(t)),true)])];
  o.innerHTML='<div>網址：'+esc(location.hostname)+(/claude/.test(location.hostname)?'　<b>（Claude 預覽頁會封鎖所有外部連線，請改用 GitHub 網址）</b>':'')+'</div><div>自架代理：'+esc(S.proxy||'未設定')+'</div><br>'+out[0].join('<br><br>')};
$('#px').onclick=async()=>{let v=prompt('自架代理網址（Cloudflare Worker），留空代表不使用\n目前：'+(S.proxy||'未設定'),S.proxy||'');if(v===null)return;v=v.trim();
  if(v){if(!/^https?:\/\//.test(v))v='https://'+v;try{v=new URL(v).origin}catch(e){alert('網址格式不正確');return}
    try{const t=await (await TO(v+'/',8000)).text();alert(t.trim()==='ok'?'代理測試成功 ✓':'這個網址有回應，但不是代理程式（回傳：'+t.slice(0,30)+'）。請確認貼的是 Worker 的網址')}catch(e){alert('連不到這個網址：'+e.message)}}
  S.proxy=v;save();refresh()};
render();refresh();
</script>
